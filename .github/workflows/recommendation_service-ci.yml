name: recommendationservice CI

# WHEN this runs: only manually, via the Actions tab (or API/CLI dispatch).
on:
  workflow_dispatch: {}

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    # WHERE the steps run: relative to the repo root by default, so we
    # tell every step in this job to work from the service's own folder.
    defaults:
      run:
        working-directory: src/recommendationservice

    steps:
      # Step 1: get the code onto the runner. Runners start EMPTY --
      # no repo, no files -- this is what puts your code there.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: install the exact Python version we're targeting.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: install this service's dependencies, same as you did locally.
      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # Step 4: the actual check. If any assertion fails, this step exits
      # non-zero, and GitHub marks the whole workflow as FAILED.
      - name: Run tests
        run: python -m pytest test_recommendation_server.py -v

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    # GITHUB_TOKEN is minted fresh for every run. By default it can only
    # read the repo -- we have to explicitly grant write access to
    # GitHub's package registry (GHCR) so this job can push images.
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/recommendationservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in to the registry when we're actually going to push.
      # PRs from unreviewed branches shouldn't authenticate to GHCR at all.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a pull_request event, this still BUILDS the image (catches
      # Dockerfile breakage on every PR) but never pushes it anywhere.
      # Only a real push (i.e. code that landed on the branch) publishes
      # an artifact.
      - name: Build (and push only on direct pushes)
        uses: docker/build-push-action@v6
        with:
          context: src/recommendationservice
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on real pushes -- never on a PR. A PR's build job never
    # even pushed an image, so there'd be nothing new to deploy anyway.
    if: github.event_name == 'push'

    # id-token: write is what lets this job request an OIDC token from
    # GitHub at all. Without this, configure-aws-credentials fails
    # immediately, even with everything else set up correctly.
    permissions:
      id-token: write
      contents: read

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/recommendationservice
      EKS_CLUSTER_NAME: upwind-lab-eks
      AWS_REGION: eu-north-1
      NAMESPACE: online-boutique

    steps:
      # This performs the actual OIDC handshake: request a token from
      # GitHub, exchange it with AWS STS for short-lived credentials,
      # scoped to exactly the role we created in Terraform. No secrets
      # stored anywhere.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590183912334:role/github-actions-recommendationservice-cd
          aws-region: ${{ env.AWS_REGION }}

      # Fetches connection details for the cluster and writes a
      # kubeconfig file -- this is the one AWS-level permission
      # (eks:DescribeCluster) our IAM role was granted.
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # This is the actual deployment: tell the existing Deployment to
      # use the image we just built, tagged with this exact commit SHA.
      # No new manifests applied -- just updating the image reference.
      - name: Update image on the cluster
        run: |
          kubectl set image deployment/recommendationservice \
            server=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}

      # Wait and confirm the rollout actually succeeds (new pods become
      # Ready) rather than just firing the update and walking away blind.
      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/recommendationservice \
            -n ${{ env.NAMESPACE }} --timeout=120s
