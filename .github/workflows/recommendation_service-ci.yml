name: recommendationservice CI

# WHEN this runs: only on pushes or PRs that touch this service's folder.
on:
  push:
    paths:
      - "src/recommendationservice/**"
      - ".github/workflows/recommendation_service-ci.yml"
  pull_request:
    paths:
      - "src/recommendationservice/**"
      - ".github/workflows/recommendation_service-ci.yml"

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    # WHERE the steps run: relative to the repo root by default, so we
    # tell every step in this job to work from the service's own folder.
    defaults:
      run:
        working-directory: src/recommendationservice

    steps:
      # Step 1: get the code onto the runner. Runners start EMPTY --
      # no repo, no files -- this is what puts your code there.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: install the exact Python version we're targeting.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: install this service's dependencies, same as you did locally.
      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # Step 4: the actual check. If any assertion fails, this step exits
      # non-zero, and GitHub marks the whole workflow as FAILED.
      - name: Run tests
        run: python -m pytest test_recommendation_server.py -v

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    # GITHUB_TOKEN is minted fresh for every run. By default it can only
    # read the repo -- we have to explicitly grant write access to
    # GitHub's package registry (GHCR) so this job can push images.
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/recommendationservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate Docker to GHCR. github.actor = whoever triggered the
      # run; GITHUB_TOKEN is the auto-generated credential, scoped only
      # to this repo, and it expires when the job finishes.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/recommendationservice
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
