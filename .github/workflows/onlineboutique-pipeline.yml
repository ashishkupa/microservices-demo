name: Online Boutique full app CI/CD

on:
  push:
    branches:
      - upwind-lab
    paths:
      - "src/**"
      - "helm-chart/**"
      - ".github/workflows/onlineboutique-pipeline.yml"
  pull_request:
    paths:
      - "src/**"
      - "helm-chart/**"
      - ".github/workflows/onlineboutique-pipeline.yml"

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 590183912334.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: adservice
            context: src/adservice
          - name: cartservice
            context: src/cartservice/src
          - name: checkoutservice
            context: src/checkoutservice
          - name: currencyservice
            context: src/currencyservice
          - name: emailservice
            context: src/emailservice
          - name: frontend
            context: src/frontend
          - name: loadgenerator
            context: src/loadgenerator
          - name: paymentservice
            context: src/paymentservice
          - name: productcatalogservice
            context: src/productcatalogservice
          - name: recommendationservice
            context: src/recommendationservice
          - name: shippingservice
            context: src/shippingservice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590183912334:role/github-actions-recommendationservice-cd
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build (and push only on direct pushes)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.name }}:latest

  deploy:
    name: Deploy full app via Helm
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    env:
      EKS_CLUSTER_NAME: upwind-lab-eks
      NAMESPACE: online-boutique

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590183912334:role/github-actions-recommendationservice-cd
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install onlineboutique ./helm-chart \
            -n ${{ env.NAMESPACE }} \
            --set images.repository=${{ env.ECR_REGISTRY }} \
            --set images.tag=${{ github.sha }} \
            --wait --timeout 5m
